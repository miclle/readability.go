name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go tests (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Cover the version pinned by go.mod and the two newer stable
        # releases. Drop or bump as new Go versions ship; never go below
        # the go.mod minimum.
        go: ['1.24.x', '1.25.x', '1.26.x']

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum

      - name: Run default tests
        run: make test

      - name: Run vet
        run: make vet

      - name: Run compatibility fixtures
        run: make compat-test

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # staticcheck@latest tracks the current Go release and refuses to
      # install on the older toolchain pinned by go.mod (1.24). Use the
      # latest stable line for this job only; the analysis itself is
      # toolchain-independent.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum

      # Run honnef.co/go/tools/cmd/staticcheck against the whole module.
      # staticcheck catches issues vet doesn't (unused params, redundant
      # type conversions, dead code, suspicious patterns) and is the de
      # facto Go linter beyond go vet.
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: $(go env GOPATH)/bin/staticcheck ./...


  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Short fuzz pass to catch regressions on the parser pipeline and
      # readerability pre-check. Local runs can use a longer FUZZTIME.
      - name: Run fuzz smoke
        run: make fuzz FUZZTIME=20s

  bench-compare:
    name: Bench compare (PR vs main)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Check out PR head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      # Dynamic baseline: record the merge-base (main) on the same runner
      # to neutralize CPU / scheduler / Go version variance between
      # baselines and the PR head. Hardware-pinned baselines committed to
      # testdata/ are intentionally not used here — they exist only for
      # local developer reference.
      - name: Record main baseline
        run: |
          git fetch origin main
          git checkout origin/main -- .
          go test -bench=. -benchmem -benchtime=1s -count=6 -run=^$ . \
            > /tmp/bench-main.txt
          git checkout HEAD -- .

      - name: Record PR head
        run: |
          go test -bench=. -benchmem -benchtime=1s -count=6 -run=^$ . \
            > /tmp/bench-pr.txt

      - name: Compare with benchstat
        run: |
          $(go env GOPATH)/bin/benchstat /tmp/bench-main.txt /tmp/bench-pr.txt \
            | tee /tmp/bench-report.txt

      - name: Upload bench report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: /tmp/bench-report.txt

